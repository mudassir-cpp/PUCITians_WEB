<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - PUCITians</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">PUCITians</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="signup.html">Signup</a>
    </div>
  </div>
</nav>

<div class="container mt-5" style="max-width: 420px;">
  <div class="box">
    <h2>Login</h2>
    <form action="student-home.html">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" placeholder="name@pucit.edu.pk">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Role</label>
        <select class="form-select" id="role" onchange="goRole()">
          <option value="student-home.html">Student</option>
          <option value="teacher-home.html">Teacher / TA</option>
          <option value="admin-home.html">Admin</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3 mb-0">No account? <a href="signup.html">Signup</a></p>
  </div>
</div>

<script>
function goRole() {
  document.querySelector('form').action = document.getElementById('role').value;
}
</script>
</body>
</html>
